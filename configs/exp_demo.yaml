# Example configuration for src.gal.experiments.runner

global:
  seed: 1729
  output_root: results
  max_points: 0          # set >0 to downsample rows uniformly

runtime:
  NUMEXPR_MAX_THREADS: 18

logging:
  level: DEBUG
  log_every: 1
  search_events: true     # record search_trace.npz per iteration

experiment:
  additivity_k: 1
  center_name: chebyshev
  active_learning_budget: 10
  align_orientation: true
  tau_max: 1.0e-5
  tau_radius_multiplier: 0.1
  use_gpu: true

trees:
  ball:
    method: pca_ballstar
    config:
      leaf_size: 100

algorithm_parameters:
  search_strategy: lower_bound

oracle:
  type: surprise

datasets:
  - name: mushroom
    paths:
      dataset_path: DATA/mined_rules/mushroom_mnr.csv
      transactions: DATA/datasets/mushroom.csv
      item_rule_map: DATA/matrices/mushroom_rules.npy
    drop_duplicate_measures: true
    measures:
      - cosine
      - yuleQ
      - kruskal
      - added_value
      - certainty

