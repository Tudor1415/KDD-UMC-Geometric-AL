global:
  output_root: "./results/al"
  seed: 1729
  max_points: 0

experiment:
  dataset_name: "MUSHROOM"
  oracle_name: "LinearOracle"
  center_name: "AnalyticCenter"   # one of: AnalyticCenter, ChebyshevCenter, MinkowskiCenter, VolumetricCenter
  active_learning_budget: 20      # number of iterations

paths:
  mnr_rules: "./mined_rules/mushroom_mnr.csv"
  matrix_npy: null                # optional fallback
  # dataset_path: null            # alternative single-path input (e.g., .npy)

algorithm_parameters:
  leaf_size: 25
  search_strategies: ["lower_bound", "diversity"]
  tree_build_methods:
    kdtree: ["kd_tree"]
    balltree: ["disjoint_greedy", "axis_median", "two_pivot", "pca_ballstar", "bottom_up", "middle_out"]

oracle:
  type: "Linear"
  # w_star: [0.2, 0.1, 0.3, 0.4]   # optional; if omitted, sampled on simplex

logging:
  search_events: true

oracles:
  names: ["linear_equal", "linear_simplex"]
