global:
  output_root: "./results/al"
  seed: 1729
  max_points: 1000
  numexpr_max_threads: 24

experiment:
  # Single dataset (kept for backward compatibility)
  dataset_name: "MUSHROOM"
  measures: ["support", "confidence"]
  oracle_name: "LinearOracle"
  center_name: "ChebyshevCenter"   # one of: AnalyticCenter, ChebyshevCenter, MinkowskiCenter, VolumetricCenter
  active_learning_budget: 25      # number of iterations (defaults to 25)
  additivity_k: 1                  # optional; Choquet additivity order (1 = no augmentation)
  tau_max: 1e-5                    # optional; max tau per iteration (default 1e-5)
  tau_radius_multiplier: 0.5          # optional; scales radius when computing tau (default 0.5)

paths:
  mnr_rules: "./mined_rules/mushroom_mnr.csv"

algorithm_parameters:
  leaf_size: 25
  search_strategies: ["lower_bound"]
  tree_build_methods:
    balltree: ["two_pivot"]

logging:
  search_events: true
  level: DEBUG           # INFO or DEBUG for more detail
  log_every: 1          # when DEBUG, emit every N iterations

oracles:
  names: ["linear_simplex"]

# Option B: multiple datasets (preferred when running many in one go)
# Provide either string names (auto-derive paths) or objects with per-dataset paths.
