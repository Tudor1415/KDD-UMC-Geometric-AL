# -------- RQ1 Experiment Config (sample) --------
global:
  output_dir: "./results/rq1"
  rng_seed_base: 1729
  num_runs: 3
  timing_repeats: 2
  epsilon: 1e-12
  n_bootstrap: 200
  ci_level: 0.95
  # Control threading backend for numexpr and cap dataset size
  numexpr_max_threads: 32
  max_points: 1000
  parallel_tree_build: true
  parallel_centers: true
  center_workers: 32

budgets:
  time_checkpoints : [0.001000, 0.001930, 0.003727, 0.007196, 0.013895,
    0.026829, 0.051795, 0.100000, 0.193070, 0.372759,
    0.719686, 1.000000]
  calls_checkpoints: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50,
                      0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95, 1.00]

centers:
  per_dataset: 5
  sampler: "positive_l1_normalized"

additivity:
  values: [1]

methods:
  random_sampling:
    enabled: true
    pair_sampling: "uniform_without_replacement"

  dual_kdtree_bnb:
    enabled: true
    leaf_size: 25
    split_rule: "widest_axis_median"
    traversal:
      priority: "LB_best_first"
      non_redundant: true
    strategy: "lower_bound"

  balltree_bnb:
    enabled: true
    leaf_size: 25
    split_rule: "center_radius"
    construction: "disjoint_greedy"
    traversal:
      priority: "LB_best_first"
      non_redundant: true
    strategy: "lower_bound"

datasets:
  - name: "MUSHROOM"
    paths:
      mnr_rules: "./mined_rules/mushroom_mnr.csv"

evaluation:
  metrics: ["A_at_time", "A_at_calls", "scaling_A_at_0p2_Tmax", "bound_tightness_hist"]
  plot_style:
    dpi: 100
    line_width: 2.0
    time_xscale: "log"      # log-scale for A@time x-axis
    calls_xscale: "linear"  # keep A@calls linear
  exports:
    csv: true
    json: true
    figures: ["pdf"]
