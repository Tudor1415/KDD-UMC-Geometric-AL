# -------- RQ1 Experiment Config (sample) --------
global:
  output_dir: "./results/rq1"
  rng_seed_base: 1729
  num_runs: 1
  epsilon: 1e-12
  ci_level: 0.95
  numexpr_max_threads: 64
  max_points: 50000
  parallel_tree_build: true
  parallel_centers: true
  center_workers: 64
  tau: 1e-7

budgets:
  time_checkpoints : [
    0.001000, 0.001187, 0.001410, 0.001676, 0.001993,
    0.002371, 0.002824, 0.003363, 0.003995, 0.004738,
    0.005609, 0.006631, 0.007834, 0.009251, 0.010918,
    0.012879, 0.015191, 0.017911, 0.021101, 0.024842,
    0.029227, 0.034364, 0.040376, 0.047413, 0.055641,
    0.065255, 0.076475, 0.089549, 0.104759, 0.122429,
    0.142999, 0.166811, 0.194260, 0.225872, 0.262246,
    0.304068, 0.352145, 0.407380, 0.470887, 0.543935,
    0.627986, 0.724724, 0.836157, 0.964661, 1.000000]

  calls_checkpoints: [
    0.001000, 0.001187, 0.001410, 0.001676, 0.001993,
    0.002371, 0.002824, 0.003363, 0.003995, 0.004738,
    0.005609, 0.006631, 0.007834, 0.009251, 0.010918,
    0.012879, 0.015191, 0.017911, 0.021101, 0.024842,
    0.029227, 0.034364, 0.040376, 0.047413, 0.055641,
    0.065255, 0.076475, 0.089549, 0.104759, 0.122429,
    0.142999, 0.166811, 0.194260, 0.225872, 0.262246,
    0.304068, 0.352145, 0.407380, 0.470887, 0.543935,
    0.627986, 0.724724, 0.836157, 0.964661, 1.000000]

centers:
  per_dataset: 1
  sampler: "positive_l1_normalized"

additivity:
  values: [1,2]

methods:
  random_sampling:
    enabled: false
    pair_sampling: "without_replacement"

  dual_kdtree_bnb:
    enabled: true
    leaf_size: 25
    split_rule: "widest_axis_median"
    strategy: "lower_bound"

  balltree_bnb:
    enabled: true
    leaf_size: 25
    construction: "two_pivot"
    strategy: "lower_bound"

datasets:
  - name: "MUSHROOM"
    paths:
      mnr_rules: "./mined_rules/mushroom_mnr.csv"

evaluation:
  metrics: ["A_at_time", "A_at_calls", "scaling_A_at_0p2_Tmax", "bound_tightness_hist"]
  plot_style:
    dpi: 100
    line_width: 2.0
    time_xscale: "log"   
    calls_xscale: "log"
  bound_tightness:
    max_samples: 100000
    remove_outliers: true         # Drop extreme tails when plotting KDE
    outlier_method: "iqr"         # one of: "iqr", "quantile"
    iqr_k: 1.5                    # Tukey fence multiplier (if method=iqr)
    q_low: 0.01                   # lower quantile (if method=quantile)
    q_high: 0.99                  # upper quantile (if method=quantile)
  exports:
    csv: false
    npz: true   
    json: false 
    figures: ["pdf"]
